[project]
name = "poker-arena"
version = "0.1.0"
description = "Local bot-vs-bot arena for no-limit Texas Hold'em, built on PokerKit"
requires-python = ">=3.11"
dependencies = ["pokerkit>=0.7.7,<0.8"]

[project.scripts]
arena = "arena.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arena"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev"]
link-mode = "copy"  # hardlinks fail inside OneDrive folders
