# Every bot the arena can seat. Add candidates here.
#
# type = "python"   an in-process class with act(obs) -> action (subclass arena.bot.BaseBot)
#   class  = "module:ClassName"   required
#   path   = "folder"             optional, added to sys.path (relative to this file)
#   kwargs = { ... }              optional constructor arguments
#
# type = "command"  any language: a process speaking JSON lines (see examples/json_bot.py)
#   command = ["exe", "arg", ...] required; "{python}" means the arena's own Python
#   cwd     = "folder"            optional, relative to this file
#   timeout = 5.0                 optional seconds per decision
#
# type = "agent"    a bot written for the AlgoSoc kit: a bot.py exposing class Agent
#   path          = "bots/<name>/bot.py"   required
#   time_limit_ms = 10                     optional; slower decisions check/fold (0 = no limit)
#
# Example (put the code in bots/mybot/):
# [bots.mybot]
# type = "agent"
# path = "bots/mybot/bot.py"

[bots.checkfold]
type = "python"
class = "arena.baselines:CheckFoldBot"

[bots.call]
type = "python"
class = "arena.baselines:CallBot"

[bots.allin]
type = "python"
class = "arena.baselines:AllInBot"

[bots.random]
type = "python"
class = "arena.baselines:RandomBot"
kwargs = { seed = 7 }

[bots.example-json]
type = "command"
command = ["{python}", "examples/json_bot.py"]

# ---- advit_lite: advitrocks9 converted to the AlgoSoc rules ----
# The submission: one standard-library bot.py, built by `uv run python tools/build_advit_lite.py`.
[bots.advit-lite]
type = "agent"
path = "dist/advit_lite/bot.py"
time_limit_ms = 10

# The original advitrocks9 (MIT, Advit Arora), the reference advit-lite is tested against. Needs numpy + eval7.
[bots.advitrocks9]
type = "command"
command = ["{python}", "bots/hosts/fullhouse_host.py", "bots/advitrocks9/bot/bot.py"]

# The original under the AlgoSoc rule: a decision over 10 ms is discarded (check/fold).
[bots.advitrocks9-10ms]
type = "command"
command = ["{python}", "bots/hosts/fullhouse_host.py", "bots/advitrocks9/bot/bot.py", "--limit-ms", "10"]
